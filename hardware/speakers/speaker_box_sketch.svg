<line x1="138" y1="190" x2="138" y2="210" stroke="#5F5E5A" stroke-width="1.5"/>
<rect x="410" y="194" width="20" height="12" rx="2" fill="#888780"/>
<line x1="177" y1="200" x2="440" y2="200" stroke="#5F5E5A" stroke-width="2" stroke-linecap="round"/>
<line x1="90" y1="200" x2="34" y2="200" stroke="#444441" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="34" y="186">sound out</text>
