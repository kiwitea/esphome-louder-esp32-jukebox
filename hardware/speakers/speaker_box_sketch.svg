<svg xmlns="http://www.w3.org/2000/svg" width="680" height="710" viewBox="0 0 680 710" role="img">
<title>Speaker box for the dollhouse window: cross-section and mounting detail</title>
<desc>Top: side view of the two-part printed box glued behind the wall, with the driver, damping wool, rear lid, wire exit and support leg standing on the floor. Bottom: close-up of the driver mounting area (plate, rim, felt gasket, flange).</desc>
<style>
text { font-family: Arial, Helvetica, sans-serif; font-size: 12px; fill: #2C2C2A; }
.h { font-weight: bold; }
.leader { stroke: #888780; stroke-width: 0.5; stroke-dasharray: 3 3; fill: none; }
.wood { fill: #FAEEDA; stroke: #854F0B; stroke-width: 0.5; }
.print { fill: #E1F5EE; stroke: #0F6E56; stroke-width: 0.5; }
.metal { fill: #F1EFE8; stroke: #5F5E5A; stroke-width: 0.5; }
.felt { fill: #5F5E5A; }
.dot { fill: #444441; }
</style>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#444441" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<rect width="680" height="710" fill="#FFFFFF"/>

<text class="h" x="12" y="24">1. Side view, cut in half (wood = amber, printed parts = green, driver = gray)</text>

