name: Build

on:
  pull_request:
  workflow_dispatch:
  workflow_run:
    workflows: ["Release Drafter"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_run' && 'release-drafter' || github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  release-info:
    name: Resolve build version
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.info.outputs.version }}
      summary: ${{ steps.info.outputs.summary }}
      url: ${{ steps.info.outputs.url }}
    steps:
      - name: Resolve draft release
        id: info
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          version=""
          summary=""
          url=""
          if [[ "${EVENT_NAME}" == "workflow_run" ]]; then
            releases=$(gh api "repos/${GH_REPO}/releases?per_page=100")
            release=$(jq \
              '[.[] | select(.draft == true and (.tag_name | startswith("untagged-") | not))] | first' \
              <<< "${releases}")
            if [[ -z "${release}" || "${release}" == "null" ]]; then
              echo "::error::No draft release found"
              exit 1
            fi
            version=$(jq -r '.tag_name' <<< "${release}")
            url="https://github.com/${GH_REPO}/releases/tag/${version}"
            summary=$(jq -r '.body' <<< "${release}" \
              | sed '/^> \[!CAUTION\]/,/<!-- ASSETS_PENDING -->/d' \
              | sed 's/<!-- ASSETS_PENDING -->//g' \
              | sed '/./,$!d')
          else
            version="dev-$(date -u +'%Y%m%d-%H%M')"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "url=${url}" >> "$GITHUB_OUTPUT"
          {
            echo "summary<<RELEASE_SUMMARY_EOF"
            echo "${summary}"
            echo "RELEASE_SUMMARY_EOF"
          } >> "$GITHUB_OUTPUT"

  build:
    name: Build firmware
    needs: release-info
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Prepare dummy secrets
        run: cp secrets.yaml.example secrets.yaml

      - name: Set firmware version
        env:
          BUILD_VERSION: ${{ needs.release-info.outputs.version }}
        run: |
          sed -i "s/version: dev/version: \"${BUILD_VERSION}\"/" kids-jukebox.factory.yaml

      - name: Build firmware
        id: esphome
        uses: esphome/build-action@v8.1.0
        with:
          yaml-file: kids-jukebox.factory.yaml
          version: 2026.11.0
          complete-manifest: true
          release-summary: ${{ needs.release-info.outputs.summary }}
          release-url: ${{ needs.release-info.outputs.url }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: firmware
          path: ${{ steps.esphome.outputs.name }}
          if-no-files-found: error

  publish-draft:
    name: Upload firmware to draft release
    if: github.event_name == 'workflow_run'
    needs:
      - release-info
      - build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v8.0.2
        with:
          name: firmware
          path: firmware

      - name: Prepare release assets
        run: |
          set -euo pipefail
          mkdir output
          cp firmware/manifest.json output/kids-jukebox.manifest.json
          shopt -s nullglob
          for file in firmware/*.{bin,elf,uf2}; do
            name=$(basename "${file}")
            cp "${file}" "output/${name}"
            md5sum "output/${name}" | cut -d ' ' -f 1 > "output/${name}.md5"
            sha256sum "output/${name}" | cut -d ' ' -f 1 > "output/${name}.sha256"
          done
          if [[ $(find output -maxdepth 1 -type f | wc -l) -le 1 ]]; then
            echo "::error::No firmware binaries found in build artifact"
            exit 1
          fi

      - name: Replace draft release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.release-info.outputs.version }}
        run: |
          set -euo pipefail
          releases=$(gh api "repos/${GH_REPO}/releases?per_page=100")
          release_id=$(jq -r --arg version "${VERSION}" \
            '[.[] | select(.tag_name == $version and .draft == true)] | first | .id // empty' \
            <<< "${releases}")
          if [[ -z "${release_id}" ]]; then
            echo "::error::Draft release ${VERSION} not found"
            exit 1
          fi
          assets=$(gh api "repos/${GH_REPO}/releases/${release_id}/assets" --paginate \
            --jq '.[] | "\(.id)\t\(.name)"')
          shopt -s nullglob
          for file in output/*; do
            name=$(basename "${file}")
            asset_id=$(awk -F '\t' -v name="${name}" '$2 == name {print $1; exit}' <<< "${assets}")
            if [[ -n "${asset_id}" ]]; then
              gh api "repos/${GH_REPO}/releases/assets/${asset_id}" --method DELETE --silent
            fi
            gh api --method POST \
              -H "Content-Type: application/octet-stream" \
              "https://uploads.github.com/repos/${GH_REPO}/releases/${release_id}/assets?name=${name}" \
              --input "${file}" --silent
          done

      - name: Remove pending warning from draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.release-info.outputs.version }}
        run: |
          set -euo pipefail
          releases=$(gh api "repos/${GH_REPO}/releases?per_page=100")
          release=$(jq --arg version "${VERSION}" \
            '[.[] | select(.tag_name == $version and .draft == true)] | first' <<< "${releases}")
          if [[ -z "${release}" || "${release}" == "null" ]]; then
            echo "::error::Draft release ${VERSION} not found"
            exit 1
          fi
          body=$(jq -r '.body' <<< "${release}")
          new_body=$(echo "${body}" \
            | sed '/^> \[!CAUTION\]/,/<!-- ASSETS_PENDING -->/d' \
            | sed 's/<!-- ASSETS_PENDING -->//g' \
            | sed '/./,$!d')
          if [[ "${new_body}" != "${body}" ]]; then
            release_id=$(jq -r '.id' <<< "${release}")
            gh api "repos/${GH_REPO}/releases/${release_id}" \
              --method PATCH \
              --field "body=${new_body}" \
              --field "tag_name=${VERSION}" \
              --field "name=${VERSION}" \
              --field "draft=true" \
              --silent
          fi
