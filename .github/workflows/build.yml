name: Build

on:
  pull_request:
  push:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    name: Compile ESPHome configuration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v7.0.1

      - name: Prepare build secrets
        run: cp secrets.yaml.example secrets.yaml

      - name: Compile firmware
        uses: esphome/build-action@v8.1.0
        with:
          yaml-file: kids-jukebox.factory.yaml
          version: 2026.10.0
