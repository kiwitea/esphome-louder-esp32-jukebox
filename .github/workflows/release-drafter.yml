name: Release Drafter

on:
  push:
    branches:
      - main

permissions:
  contents: write  # create/update the draft release
  pull-requests: read  # categorize merged pull requests

concurrency:
  group: release-drafter
  cancel-in-progress: false

jobs:
  release-drafter:
    name: Update draft release
    # Computes the next CalVer version and updates the draft changelog.
    uses: esphome/workflows/.github/workflows/draft-calver-release.yml@7f0b0f230ba1b9fa1361e699b3a2043c92f0d3f3  # 2026.11.1
