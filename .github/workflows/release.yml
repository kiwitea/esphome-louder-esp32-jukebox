name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (defaults to the most recent draft)"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.tag || 'latest-draft' }}
  cancel-in-progress: false

jobs:
  build:
    name: Verify ESPHome configuration
    uses: ./.github/workflows/build.yml

  release:
    name: Publish draft release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Publish draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if ! releases=$(gh api "repos/${GH_REPO}/releases?per_page=100"); then
            echo "::error::Failed to list releases"
            exit 1
          fi
          tag="${INPUT_TAG}"
          if [[ -z "${tag}" ]]; then
            tag=$(jq -r \
              '[.[] | select(.draft == true and (.tag_name | startswith("untagged-") | not))]
                | first | .tag_name // ""' \
              <<< "${releases}")
          fi
          if [[ -z "${tag}" || "${tag}" == "null" ]]; then
            echo "::error::No draft release found"
            exit 1
          fi
          release_id=$(jq -r --arg tag "${tag}" \
            '[.[] | select(.tag_name == $tag and .draft == true)] | first | .id // empty' \
            <<< "${releases}")
          if [[ -z "${release_id}" ]]; then
            echo "::error::Draft release ${tag} not found"
            exit 1
          fi
          gh api "repos/${GH_REPO}/releases/${release_id}" \
            --method PATCH \
            --field "tag_name=${tag}" \
            --field "name=${tag}" \
            --field "draft=false" \
            --silent
          echo "Published ${tag}"
