# ============================================================
# Kids Jukebox - Remix of Louder-ESP32-S3 + OwlBox
# ============================================================
# ESP32 audio board with TAS5805M DAC (I2C+I2S) with built-in DSP
# Features: Wi-Fi media player with mixer/resampler,
#           announcements, RGB LED, IR receiver
# Board-specific pinouts defined in substitutions
# Functional blocks imported from /packages
#
# The basics are derived from Louder-ESP32-S3:
#  Ref: https://github.com/sonocotta/esp32-audio-dock/blob/main/firmware/esphome/3-louder-esp32/louder-esp32-s3-idf.yaml
# 
# We try to stay as close as possible to the original Louder-ESP32-S3
#  because that makes updating easier.
#
# On top, we add some features from OwlBox:
#  Ref: https://github.com/XtracT/rfid_jukebox/blob/main/esphome/jukebox.yaml
#
# - playback controls via 3 buttons (play/pause, next, previous)
# - volume control via 2 buttons (up, down)
# - RFID card reader for track/playlist selection (via I2C)
# ============================================================

substitutions:
  name: kids-jukebox
  friendly_name: Kids Jukebox
  task_stack_in_psram: "true"
  ma_entity: media_player.kids_jukebox
  i2s_lrclk_pin: GPIO15
  i2s_bclk_pin: GPIO14
  i2s_dout_pin: GPIO16
  tas58xx_variant: TAS5805M
  tas58xx_enable_pin: GPIO17
  i2c_sda_pin: GPIO8
  i2c_scl_pin: GPIO9
  tas58xx_analog_gain: -9db
  tas58xx_volume_max: -12dB
  tas58xx_volume_min: -60dB
  ir_rx_pin: GPIO07

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  min_version: 2026.11.0
  name_add_mac_suffix: false
  platformio_options:
    board_build.flash_mode: dio

esp32:
  variant: ESP32S3
  flash_size: 8MB
  cpu_frequency: 240MHz
  framework:
    type: esp-idf
    version: recommended
    sdkconfig_options:
      CONFIG_ESP32S3_DATA_CACHE_64KB: "y"
      CONFIG_ESP32S3_DATA_CACHE_LINE_64B: "y"
      CONFIG_ESP32S3_INSTRUCTION_CACHE_32KB: "y"
      CONFIG_SPIRAM_RODATA: "y"
      CONFIG_SPIRAM_FETCH_INSTRUCTIONS: "y"
      CONFIG_BT_ALLOCATION_FROM_SPIRAM_FIRST: "y"
      CONFIG_BT_BLE_DYNAMIC_ENV_MEMORY: "y"
      CONFIG_MBEDTLS_EXTERNAL_MEM_ALLOC: "y"
      CONFIG_MBEDTLS_SSL_PROTO_TLS1_3: "y"

logger:
  level: DEBUG
  initial_level: INFO

ota:
  - platform: esphome
    encryption:

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

psram:
  mode: octal
  speed: 80MHz
  ignore_not_found: false

network:
  enable_ipv6: true

packages:
  sonocotta:
    url: https://github.com/sonocotta/esp32-audio-dock
    ref: 98d19a08d9b753ed7d14f2a30c799d40e3464942
    files:
      # Option A: TAS58xx configured with ganged 15-band EQ
      - firmware/esphome/packages/dac-tas58xx.yaml
      # Option B: TAS58xx configured with individual 15-band EQ per channel
      # - firmware/esphome/packages/dac-tas58xx-biamp.yaml
      # Option C: TAS58xx configured with bi-amp mode, with filters applied to both channels (HF or LF)
      # - firmware/esphome/packages/dac-tas58xx-presets.yaml

      - firmware/esphome/packages/audio.yaml
      - firmware/esphome/packages/audio-addon-external-dac.yaml
      - firmware/esphome/packages/media-player-no-light.yaml
      - firmware/esphome/packages/media-player-addon-dac-enable.yaml
      - firmware/esphome/packages/media-player-addon-tas58xx.yaml

      - firmware/esphome/packages/ir-receiver.yaml
      - firmware/esphome/packages/monitoring.yaml
      - firmware/esphome/packages/monitoring-power.yaml  # available from rev K2 or newer
      - firmware/esphome/packages/monitoring-wifi.yaml
  jukebox: !include jukebox.yaml

api:
  reboot_timeout: 0s
  encryption:
    key: !secret api_encryption_key

media_player:
  - id: !extend external_media_player
    volume_increment: 2%
    volume_max: 80%
